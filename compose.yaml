# OTProf live: nginx serving the built app and the forecast data. Settings in .env (see README, Deploy).
services:
  web:
    build: .
    image: otprof-live
    restart: unless-stopped
    ports: ["${OTPROF_LIVE_BIND:-127.0.0.1}:${OTPROF_LIVE_PORT:-8080}:8080"]
    volumes: ["${OTPROF_LIVE_DATA:-./data}:/usr/share/nginx/html/data:ro"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 1m
      timeout: 5s
