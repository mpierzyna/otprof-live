[project]
name = "otprof-live"
version = "0.1.0"
description = "Pipeline to produce live OTProf forecasts using GFS"
readme = "README.md"
authors = [
    { name = "Maximilian Pierzyna", email = "mpierzyna@tudelft.nl" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow==3.3.2",
    "cftime>=1.6.6.1",
    "dask>=2026.8.0",
    "h5netcdf>=1.8.2",
    "h5py>=3.16.0",
    "otprof[gfs,torch,hub]",
    "tqdm>=4.70.1",
    "torch==2.14.1",
]

[tool.uv.workspace]
members = [
    "otprof",
]

[tool.uv.sources]
otprof = { workspace = true }
torch = { index = "pytorch-cu126" }

# Quadro P5000 (Pascal, sm_61) is not supported by the default CUDA 13 wheels on
# PyPI. The cu126 builds still ship sm_61 kernels; 2.14.x is the last such release.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
extend-exclude = ["otprof"]
